<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腦力開發遊戲</title>
    <!-- ... 你的所有原有 <style> 保持不變 ... -->
    <style>
        /* 你的原有樣式全部保留... */
        
        /* ==================== 新音樂播放器樣式 ==================== */
        .music-player-container {
            background: #f8e9e0;
            max-width: 420px;
            margin: 30px auto;
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
        }
        .album-art {
            width: 100%;
            height: 260px;
            border: 8px solid #2e8b57;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(46, 139, 87, 0.3);
        }
        .song-info {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0 20px 0;
            min-height: 28px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn {
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: #e67e22;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: all 0.2s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }
        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            color: #2c3e50;
            font-size: 16px;
        }
        .volume-section input[type="range"] {
            width: 220px;
            accent-color: #3498db;
        }
    </style>
</head>
<body>

<!-- ... 你原本所有的內容保持不變，直到音樂區塊 ... -->

<!-- ==================== 新版音樂播放器 ==================== -->
<div class="music-player-container">
    <div class="album-art">
        <img src="forest.jpg" alt="療癒森林" style="width:100%; height:100%; object-fit:cover;">
    </div>

    <div id="song-title" class="song-info">點擊播放開始聽音樂～</div>

    <div class="controls">
        <button id="prev-btn" class="btn">上一首</button>
        <button id="play-btn" class="btn">播放</button>
        <button id="next-btn" class="btn">下一首</button>
    </div>

    <div class="volume-section">
        <span>音量</span>
        <input type="range" id="volume-slider" min="0" max="100" value="70">
    </div>
</div>

<!-- 音樂核心 -->
<audio id="audioPlayer" preload="auto"></audio>

<!-- ... 繼續你原本的其他內容 ... -->

<script>
// ========== 音樂播放器 JS（三首歌正常切換）==========
const playlist = [
    { src: "gameocean.mp3",      title: "Ocean Coast - gameocean.mp3" },
    { src: "口袋裡的太陽.mp3", title: "口袋裡的太陽" },
    { src: "One_of_a_Kind.mp3",  title: "One of a Kind" }
];

let currentTrack = 0;
const audioPlayer = document.getElementById('audioPlayer');
const playBtn = document.getElementById('play-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const songTitle = document.getElementById('song-title');
const volumeSlider = document.getElementById('volume-slider');

let isPlaying = false;

function loadTrack(index) {
    audioPlayer.src = playlist[index].src;
    songTitle.textContent = playlist[index].title;
    audioPlayer.load();
}

function togglePlay() {
    if (isPlaying) {
        audioPlayer.pause();
        playBtn.textContent = '播放';
    } else {
        audioPlayer.play().catch(() => {
            songTitle.textContent = "播放失敗，請確認 mp3 檔案存在";
        });
        playBtn.textContent = '暫停';
    }
    isPlaying = !isPlaying;
}

function nextTrack() {
    currentTrack = (currentTrack + 1) % playlist.length;
    loadTrack(currentTrack);
    if (isPlaying) audioPlayer.play();
}

function prevTrack() {
    currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
    loadTrack(currentTrack);
    if (isPlaying) audioPlayer.play();
}

// 初始化
loadTrack(0);

// 按鈕
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', nextTrack);
prevBtn.addEventListener('click', prevTrack);

// 音量
audioPlayer.volume = volumeSlider.value / 100;
volumeSlider.addEventListener('input', () => {
    audioPlayer.volume = volumeSlider.value / 100;
});

// 自動下一首
audioPlayer.addEventListener('ended', nextTrack);

</script>

<!-- 你的其他 script 繼續放在這裡... -->

</body>
</html>
