<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 大型電子寵物互動樂園 · 邊境牧羊犬 🐾</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #fef9e7 0%, #f3e5f5 50%, #e8f8f5 100%);
            min-height: 100vh;
            padding: 20px 16px 40px;
            color: #2d3436;
        }

        /* 頂部導航列 */
        .top-navbar {
            max-width: 1320px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 24px;
            background: linear-gradient(135deg, #00cec9, #0984e3);
            color: #ffffff;
            text-decoration: none;
            font-size: 19px;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.35);
            transition: all 0.2s;
            border: 2px solid #ffffff;
        }
        .back-home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(9, 132, 227, 0.45);
        }

        .page-badge {
            background: #ffffff;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 900;
            color: #8e44ad;
            box-shadow: 0 3px 10px rgba(142, 68, 173, 0.15);
            border: 2px solid #d2b4de;
        }

        /* 主標題 */
        .main-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .main-title {
            font-size: 36px;
            font-weight: 900;
            color: #8e44ad;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(142, 68, 173, 0.15);
        }

        .main-subtitle {
            font-size: 17px;
            font-weight: bold;
            color: #636e72;
            margin-top: 6px;
        }

        /* ========================================================================= */
        /* 🌟 大型寵物區：左右雙欄排版 (Left-Right Split Layout) */
        /* ========================================================================= */
        .pet-large-layout {
            max-width: 1320px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 26px;
            align-items: stretch;
        }

        @media (max-width: 980px) {
            .pet-large-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 左側：大型寵物展示區 */
        .pet-left-card {
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #8e44ad;
            box-shadow: 0 10px 30px rgba(142, 68, 173, 0.25);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 16px;
        }

        /* 狗狗心聲氣泡 */
        .pet-speech-bubble {
            width: 100%;
            background: linear-gradient(135deg, #fbf7fd, #f4ecf7);
            border: 2.5px solid #d2b4de;
            border-radius: 20px;
            padding: 12px 18px;
            font-size: 19px;
            font-weight: 900;
            color: #4a235a;
            text-align: center;
            line-height: 1.4;
            box-shadow: 0 3px 8px rgba(0,0,0,0.04);
            position: relative;
        }
        .pet-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #d2b4de transparent;
            display: block;
            width: 0;
        }

        /* 🌟 大型視訊容器 (完整呈現狗狗全身畫面不裁切，邊邊為溫馨淡粉紅) */
        .pet-video-box {
            width: 100%;
            background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%);
            border-radius: 22px;
            border: 4px solid #e8b4d8;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(142, 68, 173, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 540px;
            height: 560px;
            position: relative;
        }

        #pet-video-player {
            width: 100%;
            height: 100%;
            max-height: 560px;
            object-fit: contain;
            display: block;
            background: transparent;
        }

        /* 右側：狀態儀表板 + 放大的 9 顆互動按鈕 */
        .pet-right-card {
            background: #ffffff;
            border-radius: 28px;
            border: 4px solid #8e44ad;
            box-shadow: 0 10px 30px rgba(142, 68, 173, 0.25);
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 12px;
        }

        /* 寵物狀態卡片 */
        .pet-status-dashboard {
            background: linear-gradient(135deg, #fbf7fd, #f9f0fc);
            border: 3px solid #d2b4de;
            border-radius: 22px;
            padding: 16px 18px;
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.1);
        }

        .pet-status-title {
            font-size: 20px;
            font-weight: 900;
            color: #6c3483;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px dashed #d2b4de;
        }

        .status-rows-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 18px;
        }

        @media (max-width: 600px) {
            .status-rows-grid {
                grid-template-columns: 1fr;
            }
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-label-bar {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 900;
            color: #2d3436;
        }

        .status-val-num {
            font-weight: 900;
            color: #8e44ad;
        }

        /* 特大進度條 */
        .custom-progress {
            width: 100%;
            height: 16px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #b2bec3;
            background: #dfe6e9;
        }
        .custom-progress::-webkit-progress-bar {
            background: #dfe6e9;
        }
        .custom-progress::-webkit-progress-value {
            background: linear-gradient(90deg, #9b59b6, #8e44ad);
            border-radius: 8px;
            transition: width 0.3s ease;
        }
        .custom-progress-health::-webkit-progress-value {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }
        .custom-progress-water::-webkit-progress-value {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }
        .custom-progress-food::-webkit-progress-value {
            background: linear-gradient(90deg, #e67e22, #d35400);
        }
        .custom-progress-clean::-webkit-progress-value {
            background: linear-gradient(90deg, #1abc9c, #16a085);
        }
        .custom-progress-love::-webkit-progress-value {
            background: linear-gradient(90deg, #fd79a8, #e84393);
        }

        .mood-summary-box {
            grid-column: span 2;
            background: #ffffff;
            border: 2px solid #d2b4de;
            border-radius: 14px;
            padding: 8px 14px;
            font-size: 17px;
            font-weight: 900;
            color: #e74c3c;
            text-align: center;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .mood-summary-box {
                grid-column: span 1;
            }
        }

        /* 🌟 9 個放大的紫色互動按鈕 */
        .pet-actions-title {
            font-size: 19px;
            font-weight: 900;
            color: #6c3483;
            text-align: center;
            margin-top: -6px;
            margin-bottom: 10px;
        }

        .pet-interaction-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .btn-pet-action {
            padding: 14px 8px;
            min-height: 86px;
            font-size: 19px;
            font-weight: 900;
            border-radius: 18px;
            border: 3px solid #6c3483;
            background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 5px 0 #5b2c6f, 0 6px 14px rgba(142, 68, 173, 0.35);
            transition: all 0.12s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.25;
            user-select: none;
        }
        .btn-pet-action small,
        .btn-pet-action .btn-sub {
            font-size: 14px;
            font-weight: bold;
            opacity: 0.92;
            letter-spacing: 0.5px;
            margin-top: 3px;
            display: block;
        }
        .btn-pet-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #5b2c6f, 0 10px 18px rgba(142, 68, 173, 0.45);
            background: linear-gradient(135deg, #9b59b6 0%, #af7ac5 100%);
        }
        .btn-pet-action:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5b2c6f, 0 3px 8px rgba(142, 68, 173, 0.25);
        }
    </style>
</head>
<body>

    <!-- 頂部功能條 -->
    <div class="top-navbar">
        <a href="index.html" class="back-home-btn">🏠 返回主首頁 (Back to Home)</a>
        <div class="page-badge">🐕 邊境牧羊犬 · 陪伴專區 🐾</div>
    </div>

    <!-- 頁面標題 -->
    <div class="main-header">
        <h1 class="main-title">🐕 大型電子寵物互動樂園 🐾</h1>
        <p class="main-subtitle">照顧你的專屬邊境牧羊犬 · 餵食、洗澡、看醫生、去戶外玩耍！</p>
    </div>

    <!-- 🌟 左右雙欄主要內容 -->
    <div class="pet-large-layout">
        <!-- ========================================================================= -->
        <!-- 🌟 左側：大型寵物展示與影片區 (Left Column) -->
        <!-- ========================================================================= -->
        <div class="pet-left-card">
            <!-- 狗狗心聲對話氣泡 -->
            <div class="pet-speech-bubble" id="pet-thought-bubble">
                🐶 汪汪！我是你最忠心的邊境牧羊犬，今天想和我做什麼呢？
            </div>

            <!-- 大型視訊播放器 (加高至 560px) -->
            <div class="pet-video-box">
                <video id="pet-video-player" src="dogbreak.mp4" autoplay muted loop playsinline preload="auto"></video>
            </div>
        </div>

        <!-- ========================================================================= -->
        <!-- 🌟 右側：狀態儀表板 + 放大的 9 顆紫色互動按鈕 (Right Column) -->
        <!-- ========================================================================= -->
        <div class="pet-right-card">
            <!-- 1. 寵物狀態儀表板 -->
            <div class="pet-status-dashboard">
                <div class="pet-status-title">📊 狗狗健康狀態儀表板</div>
                <div class="status-rows-grid">
                    <!-- 健康 -->
                    <div class="status-item">
                        <div class="status-label-bar">
                            <span>❤️ 健康 (Health):</span>
                            <span class="status-val-num"><span id="health-value">100</span>/100</span>
                        </div>
                        <progress id="health-bar" class="custom-progress custom-progress-health" value="100" max="100"></progress>
                    </div>

                    <!-- 飽足感 -->
                    <div class="status-item">
                        <div class="status-label-bar">
                            <span>🍖 飽足感 (Hunger):</span>
                            <span class="status-val-num"><span id="food-value">80</span>/100</span>
                        </div>
                        <progress id="food-bar" class="custom-progress custom-progress-food" value="80" max="100"></progress>
                    </div>

                    <!-- 水分 -->
                    <div class="status-item">
                        <div class="status-label-bar">
                            <span>💧 水分 (Water):</span>
                            <span class="status-val-num"><span id="water-value">80</span>/100</span>
                        </div>
                        <progress id="water-bar" class="custom-progress custom-progress-water" value="80" max="100"></progress>
                    </div>

                    <!-- 衛生 -->
                    <div class="status-item">
                        <div class="status-label-bar">
                            <span>🧼 衛生 (Cleanliness):</span>
                            <span class="status-val-num"><span id="clean-value">100</span>/100</span>
                        </div>
                        <progress id="clean-bar" class="custom-progress custom-progress-clean" value="100" max="100"></progress>
                    </div>

                    <!-- 親密度 -->
                    <div class="status-item">
                        <div class="status-label-bar">
                            <span>💕 親密度 (Attachment):</span>
                            <span class="status-val-num"><span id="love-value">50</span>/100</span>
                        </div>
                        <progress id="love-bar" class="custom-progress custom-progress-love" value="50" max="100"></progress>
                    </div>

                    <!-- 心情總覽 -->
                    <div class="mood-summary-box">
                        <span>✨ 心情 (Mood)：</span>
                        <span id="mood-text">❤️❤️❤️❤️❤️❤️ 超開心</span>
                    </div>
                </div>
            </div>

            <!-- 2. 9 顆大尺寸紫色互動按鈕 -->
            <div>
                <div class="pet-actions-title">🎮 點擊下方按鈕與狗狗互動</div>
                <div class="pet-interaction-grid" id="interaction-panel"></div>
            </div>
        </div>
    </div>

    <script>
    // 寵物狀態
    const pet = {
        health: 100, food: 80, water: 80, clean: 100, love: 50,
        isSick: false, isDirty: false, accessory: 'none'
    };

    // DOM 元素
    const video = document.getElementById('pet-video-player');
    const thoughtBubble = document.getElementById('pet-speech-bubble') || document.getElementById('pet-thought-bubble');
    const mood = document.getElementById('mood-text');

    // 所有動作對應的影片
    const videos = {
        feed:      ['dogeat.mp4', 'eatwell.mp4'],
        water:     ['dogdrink.mp4'],
        pet:       ['haha2.mp4', 'dogpethead.mp4', 'dogpettummy.mp4'],
        bath:      ['dogshower1.mp4', 'dogshower2.mp4'],
        clean_poo: ['dpgpoo.mp4'],
        heal:      ['dogdoctor.mp4'],
        out:       ['haha2.mp4','T1.mp4','haha1.mp4','spaceelon.mp4','bigtree.mp4','doglongwall.mp4','dogwalk.mp4','dogdisney.mp4','dog101.mp4','dogjapan.mp4','dogitaly.mp4','dogswims.mp4','gotospace.mp4','dogplay1.mp4','dogplay.mp4'],
        watch:     ['T1.mp4','dogcook.mp4','dogsleep.mp4','dogbreak.mp4','dpgplaycups.mp4','dogitsback.mp4','dogwithorangecat.mp4','dogwithtwocats.mp4','dogmouse1.mp4','dogsmart1.mp4'],
        dress:     ['dogcollar.mp4','newdress1.mp4','newdress.mp4'],
        default:   ['dogbreak.mp4']
    };

    const buttonLabels = {
        feed:      '🍖 餵食<span class="btn-sub">Feed</span>',
        water:     '💧 喝水<span class="btn-sub">Water</span>',
        pet:       '💕 摸摸<span class="btn-sub">Pet</span>',
        bath:      '🧼 洗澡<span class="btn-sub">Bath</span>',
        clean_poo: '💩 清便<span class="btn-sub">Clean</span>',
        heal:      '💊 看病<span class="btn-sub">Heal</span>',
        out:       '🌳 散步<span class="btn-sub">Walk</span>',
        watch:     '📷 偷看<span class="btn-sub">Watch</span>',
        dress:     '🎀 裝扮<span class="btn-sub">Dress</span>'
    };

    const thoughtMessages = {
        feed:      '🍖 狗狗正在大口吃飼料！肚子飽飽好滿足，謝謝主人！汪汪！',
        water:     '💧 咕嚕咕嚕喝水水～解渴真舒服！',
        pet:       '🥰 摸摸頭最舒服了～我最喜歡主人了！汪汪！',
        bath:      '🚿 洗泡泡浴香噴噴～我是最乾淨帥氣的小狗！',
        clean_poo: '✨ 便便清理乾淨了～環境好乾淨好舒服喔！',
        heal:      '🩺 醫生叔叔檢查完畢～身體健康滿分！',
        out:       '🏃 耶！出去大草皮跑步玩耍，世界好大好好玩！',
        watch:     '👀 監視器裡我都在乖乖看家喔，我很乖吧！',
        dress:     '🎀 換上漂亮新裝扮囉！看看我是不是超級可愛帥氣！',
        default:   '🐶 汪汪！我是你的專屬邊境牧羊犬，點擊下方按鈕和我互動喔！🐾'
    };

    let currentAction = 'default';
    let isActionBusy = false;
    let safetyTimeout = null;
    let actionIndices = {};
    try {
        actionIndices = JSON.parse(localStorage.getItem('pet_action_indices_petpage') || '{}');
    } catch(e) {}

    // 輪播選片
    function getNextVideo(action) {
        const list = videos[action] || videos.default;
        if (actionIndices[action] === undefined || actionIndices[action] >= list.length) {
            actionIndices[action] = 0;
        }
        const curIdx = actionIndices[action];
        const selected = list[curIdx];
        actionIndices[action] = (curIdx + 1) % list.length;
        try {
            localStorage.setItem('pet_action_indices_petpage', JSON.stringify(actionIndices));
        } catch(e) {}
        return selected;
    }

    // 更新數值與心情
    function updateStatus() {
        if (document.getElementById('health-value')) document.getElementById('health-value').textContent = pet.health;
        if (document.getElementById('food-value')) document.getElementById('food-value').textContent = pet.food;
        if (document.getElementById('water-value')) document.getElementById('water-value').textContent = pet.water;
        if (document.getElementById('clean-value')) document.getElementById('clean-value').textContent = pet.clean;
        if (document.getElementById('love-value')) document.getElementById('love-value').textContent = pet.love;

        if (document.getElementById('health-bar')) document.getElementById('health-bar').value = pet.health;
        if (document.getElementById('food-bar')) document.getElementById('food-bar').value = pet.food;
        if (document.getElementById('water-bar')) document.getElementById('water-bar').value = pet.water;
        if (document.getElementById('clean-bar')) document.getElementById('clean-bar').value = pet.clean;
        if (document.getElementById('love-bar')) document.getElementById('love-bar').value = pet.love;

        const avg = (pet.health + pet.food + pet.water + pet.clean + pet.love) / 5;
        if (mood) {
            if (avg >= 80) mood.textContent = '💖 超開心';
            else if (avg >= 60) mood.textContent = '😊 開心';
            else if (avg >= 40) mood.textContent = '😐 普通';
            else if (avg >= 20) mood.textContent = '⚡ 不開心';
            else mood.textContent = '😭 哭哭';
        }
    }

    // 鎖定 / 解鎖按鈕
    function setButtonsDisabled(disabled) {
        const panel = document.getElementById('interaction-panel');
        if (!panel) return;
        panel.querySelectorAll('button').forEach(btn => {
            btn.disabled = disabled;
            btn.style.opacity = disabled ? '0.5' : '1';
            btn.style.cursor = disabled ? 'not-allowed' : 'pointer';
        });
    }

    // 安全播放
    function safePlay(v, withSound = false) {
        v.muted = !withSound;          // true = 有聲音，false = 靜音
        v.playsInline = true;
        const p = v.play();
        if (p !== undefined) {
            p.catch(err => {
                console.warn('Play error:', err);
                if (withSound) {
                    v.muted = true;
                    v.play().catch(() => {});
                }
            });
        }
    }

    // 回到待機狀態（靜音）
    function resetToStandby() {
        if (safetyTimeout) {
            clearTimeout(safetyTimeout);
            safetyTimeout = null;
        }
        currentAction = 'default';
        if (thoughtBubble) thoughtBubble.textContent = thoughtMessages.default;

        video.loop = true;
        video.muted = true;

        const currentSrc = video.currentSrc || video.src || '';
        if (!currentSrc.includes('dogbreak.mp4')) {
            video.src = 'dogbreak.mp4';
            video.load();
        }
        safePlay(video);               // 待機維持靜音

        isActionBusy = false;
        setButtonsDisabled(false);
    }

    // 主要動作函式（按下按鈕 → 有聲音）
    function doAction(action) {
        if (isActionBusy) return;
        isActionBusy = true;
        setButtonsDisabled(true);

        currentAction = action;

        // 更新寵物數值
        if (action === 'feed')       pet.food  = Math.min(100, pet.food + 25);
        if (action === 'water')      pet.water = Math.min(100, pet.water + 25);
        if (action === 'pet')        pet.love  = Math.min(100, pet.love + 15);
        if (action === 'bath')       pet.clean = 100;
        if (action === 'clean_poo')  pet.clean = Math.min(100, pet.clean + 40);
        if (action === 'heal')       { pet.health = 100; pet.isSick = false; }
        if (action === 'dress')      pet.accessory = (pet.accessory === 'none' ? 'hat' : 'none');
        updateStatus();

        // 取得下一個輪播影片
        const selectedVideo = getNextVideo(action);

        // 顯示對應的心聲對話
        if (thoughtBubble) {
            thoughtBubble.textContent = thoughtMessages[action] || thoughtMessages.default;
        }

        // 切換影片並播放（有聲音）
        video.loop = false;
        video.src = selectedVideo;
        video.load();
        safePlay(video, true);         // ← 按下按鈕有聲音

        // 安全計時器 20 秒
        if (safetyTimeout) clearTimeout(safetyTimeout);
        safetyTimeout = setTimeout(() => {
            if (currentAction !== 'default') {
                resetToStandby();
            }
        }, 20000);
    }

    // 動態產生按鈕
    function createButtons() {
        const panel = document.getElementById('interaction-panel');
        if (!panel) return;
        panel.innerHTML = '';

        const actions = ['feed', 'water', 'pet', 'bath', 'clean_poo', 'heal', 'out', 'watch', 'dress'];
        actions.forEach(action => {
            const btn = document.createElement('button');
            btn.className = 'btn-pet-action';
            btn.innerHTML = buttonLabels[action];
            btn.onclick = () => doAction(action);
            panel.appendChild(btn);
        });
    }

    // 初始化
    function initPetModule() {
        createButtons();
        updateStatus();

        // 預設待機影片（靜音）
        video.loop = true;
        video.src = 'dogbreak.mp4';
        video.load();
        safePlay(video);               // 待機靜音

        // 播完自動回待機
        video.addEventListener('ended', () => {
            resetToStandby();
        });

        // 發生錯誤時回待機
        video.addEventListener('error', () => {
            console.warn('影片播放中斷，自動回到待機狀態');
            resetToStandby();
        });
    }

    // 頁面載入後執行
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPetModule);
    } else {
        initPetModule();
    }
    </script>
</body>
</html>
